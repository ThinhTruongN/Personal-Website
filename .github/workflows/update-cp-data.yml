name: Update data and deploy site

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main] # redeploy whenever you push changes

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write # deploy to GitHub Pages
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats (Codeforces, AtCoder, LeetCode, spreadsheet)
        run: node scripts/fetch-cp-data.mjs

      - name: Commit refreshed data
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update competitive programming data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
